repos:
  - repo: https://github.com/batmac/pre-commit-zig
    rev: v0.3.0
    hooks:
      - id: zig-fmt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: zon2nix
        name: zon2nix
        entry: bash -c 'if command -v nix >/dev/null 2>&1; then nix develop -c zon2nix --nix=build.zig.zon.nix --json=build.zig.zon.json --txt=build.zig.zon.txt "$@"; else echo "nix not found, skipping zon2nix"; exit 0; fi' --
        language: system
        files: ^build\.zig\.zon$
        pass_filenames: true
