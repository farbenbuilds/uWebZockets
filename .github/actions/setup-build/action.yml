name: Setup build environment
description: Install Nix and restore the per-mode Zig and C/C++ build caches.

inputs:
  cache-suffix:
    description: Per-mode cache discriminator (for example debug, asan, release).
    required: true

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Zig and C/C++ build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cache/zig
          .zig-cache/vendor-build-v4
          tests/package_consumer/.zig-cache/vendor-build-v4
        key: ${{ runner.os }}-zig-v7-${{ inputs.cache-suffix }}-${{ hashFiles('build.zig', 'builds/**/*.zig', 'build.zig.zon', 'flake.nix', 'flake.lock', 'patches/**', 'vendor/**') }}
        restore-keys: |
          ${{ runner.os }}-zig-v7-${{ inputs.cache-suffix }}-

    # The cache restores build outputs with their original mtimes, which are older
    # than the fresh checkout. Ninja would then treat every restored object as
    # stale and rebuild it. Bumping the restored trees past the checkout keeps a
    # cache hit from turning into a full C/C++ rebuild.
    - name: Refresh restored vendor timestamps
      shell: bash
      run: |
        for tree in .zig-cache/vendor-build-v4 tests/package_consumer/.zig-cache/vendor-build-v4; do
          if [ -d "$tree" ]; then
            find "$tree" -exec touch {} +
          fi
        done
