name: Setup build environment
description: Install Nix and restore the shared Zig and C/C++ build caches.

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      with:
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: Cache Zig and C/C++ build artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cache/zig
          .zig-cache/vendor-build-v4
        key: ${{ runner.os }}-zig-v6-${{ hashFiles('build.zig', 'builds/**/*.zig', 'build.zig.zon', 'flake.nix', 'flake.lock', 'vendor/**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-zig-v6-
