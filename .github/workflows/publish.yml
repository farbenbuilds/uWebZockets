name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  autobahn:
    name: Autobahn compliance
    uses: ./.github/workflows/autobahn_compliance.yml

  h1spec:
    name: h1spec compliance
    uses: ./.github/workflows/h1spec_compliance.yml

  http3:
    name: HTTP/3 cross-implementation compliance
    uses: ./.github/workflows/http3_compliance.yml

  oss_fuzz:
    name: OSS-Fuzz compatibility
    uses: ./.github/workflows/oss_fuzz.yml

  verify:
    name: Verify tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Zig and C/C++ build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: ${{ runner.os }}-publish-zig-v7-${{ hashFiles('build.zig', 'builds/**/*.zig', 'build.zig.zon', 'flake.nix', 'flake.lock', 'patches/**', 'vendor/lsquic_overlay/**') }}
          restore-keys: |
            ${{ runner.os }}-publish-zig-v7-

      - name: Check formatting and conventions
        run: |
          nix develop "path:." -c zig fmt --check build.zig build.zig.zon builds src examples tests fuzz
          nix develop "path:." -c sh scripts/check_conventions.sh

      - name: Run centralized tests
        run: nix develop "path:." -c zig build test --summary all

      - name: Run ASan and UBSan tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: nix develop "path:." -c zig build test -Dsanitize=true -Doptimize=ReleaseSafe --summary all

      - name: Run MemorySanitizer tests
        env:
          MSAN_OPTIONS: halt_on_error=1:track_origins=2
        run: nix develop "path:." -c zig build msan -Dmemory-sanitize=true -Doptimize=ReleaseSafe --summary all

      - name: Compile ReleaseSafe tests and OSS-Fuzz ABI objects
        run: |
          nix develop "path:." -c zig build test-compile -Doptimize=ReleaseSafe --summary all
          nix develop "path:." -c zig build oss-fuzz-objects -Doptimize=ReleaseSafe --summary all

      - name: Compile downstream package consumer
        working-directory: tests/package_consumer
        run: nix develop "path:../.." -c zig build check -Doptimize=ReleaseSafe --summary all

  release:
    name: Create GitHub release
    needs:
      - autobahn
      - h1spec
      - http3
      - oss_fuzz
      - verify
    runs-on: ubuntu-24.04
    environment: Publish
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 {
              found = 1
              next
            }
            found && /^## \[/ {
              exit
            }
            found {
              print
            }
            END {
              if (!found) exit 1
            }
          ' CHANGELOG.md >release_notes.md

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          release_flags=()
          case "$version" in
            *-*)
              release_flags+=(--prerelease)
              ;;
            *)
              release_flags+=(--latest)
              ;;
          esac

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "uWebZockets $GITHUB_REF_NAME" \
              --notes-file release_notes.md \
              "${release_flags[@]}"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "uWebZockets $GITHUB_REF_NAME" \
              --notes-file release_notes.md \
              "${release_flags[@]}"
          fi
