name: h1spec-compliance

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    environment: "h1spec Compliance"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build, Start Server, and Run h1spec tests
        run: |
          nix develop -c bash -c "zig build && ./zig-out/bin/h1spec" &
          sleep 5
          cd vendor/h1spec
          deno run --allow-net http_test.ts 127.0.0.1 8000
